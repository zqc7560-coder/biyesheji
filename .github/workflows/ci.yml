# =====================================================================
# CI：push 触发后端 mvn test + 前端 build（WBS 1.2.5，阶段二验收项）。
# 说明：后端测试用 test profile（H2 内存库），服务镜像无需起 MySQL/Redis，
# 流水线保持零中间件依赖——这也反过来验证"测试不依赖外部环境"的约束。
# 若本仓库为私有且未启用 Actions，本地以 `mvn test` + `npm run test/build` 为准。
# =====================================================================
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run unit & integration tests (H2)
        run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Unit tests (Vitest)
        run: npm run test
      - name: Production build
        run: npm run build
