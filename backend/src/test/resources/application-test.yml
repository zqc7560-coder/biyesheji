# =====================================================================
# test profile：单元/接口测试专用 —— 数据源切换 H2 内存库（MySQL 兼容模式）。
# 环境约束（进度台账）：测试绝不依赖真实 MySQL 账号口令。
# =====================================================================
spring:
  datasource:
    # MODE=MySQL: 反引号/AUTO_INCREMENT 等 MySQL 方言可用
    # DATABASE_TO_LOWER: 未加引号的标识符统一小写，与 MySQL 行为一致，列名映射不乱
    # 独立数据库名 blog_test + DB_CLOSE_DELAY=-1：同一 JVM 内多测试类共享数据
    url: jdbc:h2:mem:blog_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      # H2 版 DDL：与 docs schema.sql 同步维护，剥离了 FULLTEXT/UNSIGNED/ON UPDATE 等 H2 不支持项
      schema-locations: classpath:sql/schema-h2.sql
      data-locations: classpath:sql/data-h2.sql
  data:
    redis:
      # 测试环境 Redis：指向一个必然无监听的端口，连接探测快速失败（不长时间阻塞），
      # 由测试里的 @MockBean StringRedisTemplate 接管，不产生真实网络依赖。
      host: 127.0.0.1
      port: 6390
      timeout: 200ms
      connect-timeout: 200ms

# M6：AI 测试需要固定 AES-GCM 主密钥（64 位 hex=32 字节）。
# 纯测试专用值——它加密的明文也只出现在测试里（sk-TEST-FAKE-*），与任何真实 Key 无关。
# BLOG_AI_KEY_* 显式置空 + key-file 指向不存在路径：彻底禁掉 BuiltinModelKeySeeder，
# 保证测试库里种子占位行（__PENDING_KEY_IMPORT__）不被真实 Key 覆盖——
# 否则开发者本机 backend/.env 一旦存在，所有依赖"未导入 Key"态的用例会随环境漂移。
# M8：测试上传落盘指到 target/ 下（target 已在 .gitignore，跑完随 mvn clean 消失，
# 不污染工作区 uploads/——生产/dev 默认 ./uploads 不变）
blog:
  upload:
    dir: ./target/test-uploads
  ai:
    master-key: 000102030405060708090a0b0c0d0e0f000102030405060708090a0b0c0d0e0f
    key-file: ./nonexistent-test-only.env
  # M9：测试内禁用 PV 回写的自动调度（初始延迟 24h=事实上永不触发）。
  # 动机：整套测试跑数分钟，若 5min 节拍的回写任务在断言中途乱入，
  # view_count 会"自己涨"——调度行为由测试直接调 syncNow() 显式驱动，
  # 消除"调度线程与断言赛跑"这类假阳性（PvSyncJob 注释同义）。
  pv:
    initial-delay-ms: 86400000
    sync-interval-ms: 86400000
BLOG_AI_KEY_DEEPSEEK: ""
BLOG_AI_KEY_QWEN: ""

# M6：测试用 @TestConfiguration 的 aiExecutor（同步直连池）覆盖 AiAsyncConfig 的
# 真实线程池——同名 Bean 覆盖必须显式开闸。动机：MockMvc + 类级 @Transactional 下，
# 异步线程看不到测试事务里预置的 ai_config 行（跨连接不可见），同步化后
# 摘要管道全链路跑在测试事务内，可控可断言；超时/线程卸载语义在 35s 级不在单元层验证。
spring.main.allow-bean-definition-overriding: true

logging:
  level:
    com.blog: debug
