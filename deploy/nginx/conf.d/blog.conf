# =====================================================================
# Nginx 生产站点配置（M12）—— 设计依据《部署与测试.md》§1.3 要点 + §1.7.3
# 三大职责：SPA 静态托管 / /api 反代（超时链对齐）/ /uploads 图片直出（缓存头）
# 挂载路径：容器内 /etc/nginx/conf.d/blog.conf（compose 只读挂载本目录）
# =====================================================================

# 静态资源指纹缓存策略（WBS 1.7.3）：Vite 产物文件名带 hash（assets/xxx-<hash>.js），
# 内容变则文件名变，可以放心给浏览器 7 天长缓存；index.html 绝不能缓存，
# 否则前端发版后用户拿旧 index 引用已删除的 hash 文件白屏。
map $sent_http_content_type $blog_cache_control {
    default            "public, max-age=604800";          # 带 hash 的静态资源 7d
    text/html          "no-cache";                        # 入口 HTML：协商缓存
    application/json   "no-store";
}

# =====================================================================
# 后端反代 upstream 连接池（M16 正式压测抓出的真实部署缺陷）
# 现象：场景①「列表 200 并发 ×5min」经 Nginx 跑出 65% 的 502，
# error.log 成片 `connect() to 172.18.0.x:8080 failed (99: Address not
# available)`（errno 99 = EADDRNOTAVAIL，临时端口耗尽）。
# 根因：直写 `proxy_pass http://blog-server:8080` 时 Nginx 每请求新建一条
# 到后端的 TCP 连接。千级 req/s 下连接开合速度远超 TIME_WAIT 回收，容器网段
# 的本地端口很快见底 → 新连接 bind 不上 → 502。
# 修复：upstream + keepalive 连接池，稳态下 Nginx→后端只剩几十条长连接复用，
# 端口 churn 从根上消失。必须三件套齐全才生效：
#   ① upstream.keepalive N  （池容量，按 worker 计）
#   ② location 内 proxy_http_version 1.1  +  ③ proxy_set_header Connection ""
#      —— 否则按 HTTP/1.0 语义每响应即关连接，池子永远存不住东西（②③本文件已有）。
# 顺带把 keepalive_requests 拉高：Tomcat 侧 keepAliveTimeout 默认 60s，
# Nginx 默认 1000 请求就轮换连接，高吞吐下轮换本身也是 churn 源。
# 峰值瞬发超出池容量时仍会新建连接（退化为修复前行为），不会报错——是纯优化。
upstream blog_api {
    server blog-server:8080;
    keepalive 64;
    keepalive_requests 100000;
    keepalive_timeout 300s;
}

server {
    listen 80;
    server_name _;

    # 上传体积闸门与后端对齐（§1.3）：后端 multipart max-request=6MB，
    # Nginx 卡 6m 让"超限"在入口就 413，不必打到 Java 再抛 3002。
    client_max_body_size 6m;

    access_log /var/log/nginx/blog-access.log;
    error_log  /var/log/nginx/blog-error.log warn;

    # ---------- /api → blog-server:8080 ----------
    location /api {
        # 走 upstream 连接池而非直写 proxy_pass 目标（M16 压测缺陷修复，
        # 缘由见文件头 upstream blog_api 注释）
        proxy_pass http://blog_api;
        # X-Real-IP / X-Forwarded-For：登录日志（login_log）记真实 IP 而非容器网 IP，
        # 没有这两行，答辩演示"IP 留痕"功能全是 172.18.0.x
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 超时链（《AI模块设计.md》§7.3）：浏览器 Axios 40s > Nginx 读超时 60s
        # > DeferredResult 35s > 单次上游 HTTP 30s。Nginx 必须大于 35s，
        # 否则 AI 超时由 Nginx 先掐断返回 504，用户看不到后端的 4002 降级文案。
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
    }

    # ---------- Knife4j 文档：生产默认不暴露，需要时解开注释（§1.1：prod 关闭） ----------
    # location ~ ^/(doc.html|webjars/|v3/api-docs) {
    #     proxy_pass http://blog-server:8080;
    # }

    # ---------- /uploads 图片直出（共享卷，后端写入、Nginx 伺候读） ----------
    location /uploads {
        alias /usr/share/nginx/uploads;
        # 上传文件名是 uuid 重命名（M8）：内容不可变，30 天强缓存安全
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # ---------- SPA 入口与兜底 ----------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Vue Router history 模式：/archive、/admin/xxx 等前端路由直接刷新时
        # 磁盘上没有对应文件，try_files 兜回 index.html 交给路由接管
        try_files $uri $uri/ /index.html;
        add_header Cache-Control $blog_cache_control;
    }

    # ---------- 传输压缩（WBS 1.7.3）：Markdown 正文/JS 包文本占比高，gzip 立省六成 ----------
    gzip on;
    gzip_comp_level 5;                # 5 是 CPU/压缩率甜点，2C4G 演示机不必上 9
    gzip_min_length 1k;               # <1KB 压缩收益抵不过头部开销
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml text/markdown;
    # 已知限制：内联 SVG 上传（MIME 白名单含 image/svg+xml）在浏览器直接打开时
    # 可执行脚本。防线是存储侧双闸（M8 魔数嗅探只收位图四族 + uuid 重命名丢扩展名语义），
    # 这里再显式断掉上传目录的脚本执行面：强制下载而非渲染。
    # （FileTypeValidator 白名单实际仅 png/jpg/jpeg/gif/webp，此段为纵深防御。）
}

