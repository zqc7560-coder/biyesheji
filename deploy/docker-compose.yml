# =====================================================================
# 个人博客系统 · 一键部署编排（M12）
# 设计依据：《部署与测试.md》§1.3 核心文件的落地版。
#
# 与原设计稿的差异（M12 定稿，均在 README 有对应说明）：
# 1) version 字段删除：Compose v2 已废弃该键（写了只触发 warning）。
# 2) 目录适配：仓库实际结构是 backend/ + frontend/（设计稿写的是 blog-server/
#    blog-web/），全部相对路径按实际仓库调整；schema 挂载用 backend/src/main
#    /resources/db/mysql/schema.sql（M1 产物，含 CREATE DATABASE + 15 表 DDL），
#    并追加 data.sql 作 02 号脚本（M1 幂等种子：RBAC/内置模型占位/系统参数）。
# 3) JDK 17 改 21：与开发环境对齐（详见 backend/Dockerfile 注释）。
# 4) AI Key 注入：设计稿只有 BLOG_AI_MASTER_KEY（加密主密钥），但系统"开箱即用"
#    还依赖两把内置模型真实 Key —— BuiltinModelKeySeeder 从环境变量读取后
#    AES-GCM 加密入库。compose 增加透传（缺省为空=占位待管理员后台导入，
#    不阻断启动），真实值一律写在 deploy/.env（已 gitignore），永不进 git。
#
# 用法（Ubuntu 22.04 / 任意装了 Docker+Compose v2 的机器）：
#   cd deploy && cp .env.example .env && vi .env（填强口令）
#   docker compose up -d --build     # 到可访问 <5 分钟（里程碑 M6 验收项）
# =====================================================================

services:
  # ---------- MySQL 8.0：utf8mb4 + ngram 全文分词（D-9：token_size 建库后不可改，
  #          必须在这里启动参数里给死）----------
  mysql:
    image: mysql:8.0
    command:
      - --ngram_token_size=2
      - --default-time-zone=+08:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE-ME-STRONG-PASSWORD}
      MYSQL_DATABASE: blog_db
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动（空卷）自动按文件名序执行：先建表、后种子。两脚本自带 USE blog_db，
      # 且 data.sql 全量 INSERT IGNORE ——重复执行容器不会把初始化炸掉。
      - ../backend/src/main/resources/db/mysql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../backend/src/main/resources/db/mysql/data.sql:/docker-entrypoint-initdb.d/02_data.sql:ro
    healthcheck:
      # $$ 是 compose 转义：让容器内的 shell 展开 MYSQL_ROOT_PASSWORD，而不是宿主机插值
      test: ["CMD-SHELL", 'mysqladmin ping -h localhost -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent']
      interval: 10s
      retries: 12
      start_period: 30s

  # ---------- Redis 7：AOF everysec 持久化（黑名单/PV计数/缓存都不该在重启后裸奔），
  #          requirepass 强制（§1.1：生产 Redis 无密码=净负资产）----------
  redis:
    image: redis:7-alpine
    command: >
      redis-server --appendonly yes --appendfsync everysec
      --requirepass ${REDIS_PASS}
      --maxmemory 256mb --maxmemory-policy allkeys-lru
    # 【修复】healthcheck 里用的是容器侧展开的 $${REDIS_PASS}，必须把变量注入容器，
    # 否则 redis-cli 用空密码认证 → WRONGPASS → 容器永远 unhealthy，
    # 导致 blog-server 因 depends_on 健康门禁永远起不来（原 M12 编排缺此块）。
    environment:
      REDIS_PASS: ${REDIS_PASS}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$${REDIS_PASS}" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      retries: 6

  # ---------- 后端：多阶段 Dockerfile（backend/Dockerfile）。profile=docker，
  #          经 application.yml 的 spring.profiles.group 级联继承 prod 全部覆盖
  #          （M13：此前 docker 是悬空引用，prod 覆盖项在容器里不生效）----------
  blog-server:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      BLOG_DB_URL: jdbc:mysql://mysql:3306/blog_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      BLOG_DB_USERNAME: root
      BLOG_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      BLOG_REDIS_HOST: redis
      BLOG_REDIS_PORT: "6379"
      BLOG_REDIS_PASSWORD: ${REDIS_PASS}
      BLOG_JWT_SECRET: ${BLOG_JWT_SECRET}
      # AI 加密主密钥（KeyCipherService）——与开发机不是同一把：换密钥=历史密文解不开，
      # 部署到新环境后需在后台重配模型 Key（§6 R-06 应急路径）
      BLOG_AI_MASTER_KEY: ${BLOG_AI_MASTER_KEY}
      # 内置两模型的开箱即用 Key（BuiltinModelKeySeeder 读环境变量到 AES-GCM 到 ai_config）。
      # 可选：留空则占位待管理员后台导入，系统其余功能照常（降级设计）。
      BLOG_AI_KEY_DEEPSEEK: ${BLOG_AI_KEY_DEEPSEEK:-}
      BLOG_AI_KEY_QWEN: ${BLOG_AI_KEY_QWEN:-}
      BLOG_ADMIN_PASSWORD: ${BLOG_ADMIN_PASSWORD:-Admin@123}
      BLOG_UPLOAD_DIR: /app/uploads
      TZ: Asia/Shanghai
    volumes:
      - uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 15s
      retries: 8
      start_period: 60s

  # ---------- Nginx：静态托管 dist + /api 反代 + uploads 直出（§1.2 拓扑）----------
  nginx:
    image: nginx:1.25-alpine
    # healthcheck（M16 压测收尾补）：smoke-deploy.sh 与交付验收的口径是
    # "全部容器 healthy"，nginx 缺 healthcheck 时 Status 永远不含 healthy，
    # 该口径对四服务根本不成立。探测打 /api/health 而非 /：一条断言同时核验
    # nginx→blog-server 反代链路活着（首页 200 由冒烟脚本第 2 项独立负责）。
    # busybox wget 即可用（alpine 镜像无 curl），--spider 只探活不落盘。
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider -T 5 http://127.0.0.1/api/health || exit 1"]
      interval: 15s
      retries: 5
      start_period: 10s
    ports:
      - "80:80"
      # 演示机无 TLS 证书时：blog.conf 里 443 段整体注释，此端口映射保持注释——
      # nginx 不 listen 443 却映射端口只会把 443 黑洞化（连上必断），误导排障。
      # 有证书时与 blog.conf 443 段同步解开：
      # - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # 前端产物先在宿主机 npm run build（§1.4 步骤 2；不引 node 构建容器——
      # 毕设量级构建 30s，加一个镜像层不值得）
      - ../frontend/dist:/usr/share/nginx/html:ro
      # 与 blog-server 共享 uploads 卷：图片由后端写入、由 Nginx 直出（带缓存头），
      # 后端进程不伺候静态文件请求 —— 这就是 §1.2 架构图的 /uploads 分支
      - uploads:/usr/share/nginx/uploads:ro
    depends_on:
      blog-server: { condition: service_healthy }

volumes:
  mysql-data: {}
  redis-data: {}
  uploads: {}
